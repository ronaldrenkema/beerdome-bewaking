name: Bewaking

on:
  schedule:
    - cron: '*/10 * * * *'   # elke 10 minuten (GitHub start soms een paar minuten later)
    - cron: '0 7 * * 1'      # maandag 08:00/09:00: "bewaking leeft"
  workflow_dispatch:

concurrency: bewaking

permissions:
  contents: write            # alleen voor de maandelijkse keepalive-commit

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vorige status ophalen
        uses: actions/cache/restore@v4
        with:
          path: state
          key: status-${{ github.run_id }}
          restore-keys: status-
      - name: Controleren
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p state
          node check.mjs ${{ github.event.schedule == '0 7 * * 1' && '--weekbericht' || '' }}
      - name: Status bewaren
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: status-${{ github.run_id }}
      # GitHub zet geplande workflows uit na 60 dagen zonder activiteit in de repo
      - name: Keepalive
        if: github.event.schedule == '0 7 * * 1'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((40*86400)) ]; then
            git config user.name "beerdome-bewaking"; git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push
          fi
